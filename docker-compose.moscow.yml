# Run with: docker compose -p efr_moscow -f docker-compose.yml -f docker-compose.moscow.yml up --build
# This override deliberately has its own database name and volume.
services:
  postgres:
    environment:
      POSTGRES_DB: employer_first_roadmap_moscow
      POSTGRES_USER: efr_moscow
      POSTGRES_PASSWORD: efr_moscow_local_password
    volumes:
      - postgres_moscow_data:/var/lib/postgresql/data
  efr_bot:
    environment:
      APP_ENV: moscow
      SEED_DEMO_DATA: "false"
      SEED_MOSCOW_CATALOG: "true"
      DB_NAME: employer_first_roadmap_moscow
      DB_USER: efr_moscow
      DB_PASSWORD: efr_moscow_local_password

volumes:
  postgres_moscow_data:
