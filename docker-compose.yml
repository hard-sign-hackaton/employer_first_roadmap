services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  efr_bot:
    build: ./
    ports:
      - "${EMPLOYER_API_PORT}:${EMPLOYER_API_PORT}"
    environment:
      - APP_ENV=main
      - BOT_TOKEN=${BOT_TOKEN}
      - EMPLOYER_API_PORT=${EMPLOYER_API_PORT}
      - SEED_DEMO_DATA=false
      - SEED_MAIN_CATALOG=true
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - EMPLOYER_ALLOWED_ORIGIN=${EMPLOYER_ALLOWED_ORIGIN:-*}
      - REMINDERS_ENABLED=${REMINDERS_ENABLED:-true}
      - REMINDER_CRON=${REMINDER_CRON:-0 10 * * 1}
      - REMINDER_TIMEZONE=${REMINDER_TIMEZONE:-Europe/Moscow}
      - DB_HOST=postgres
      - DB_PORT=${POSTGRES_PORT}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
