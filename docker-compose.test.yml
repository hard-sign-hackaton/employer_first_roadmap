services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB_TEST}
      POSTGRES_USER: ${POSTGRES_USER_TEST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  tests:
    image: golang:1.26.5
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      RUN_POSTGRES_INTEGRATION: "1"
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB_TEST}
      DB_USER: ${POSTGRES_USER_TEST}
      DB_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    # Пакеты используют одну интеграционную БД, поэтому запускаем их
    # последовательно, чтобы независимые seed-транзакции не конфликтовали.
    command: go test -p 1 ./... -v

volumes:
  postgres_test_data:
