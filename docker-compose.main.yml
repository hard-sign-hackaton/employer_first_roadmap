# Run with: docker compose -p efr_main -f docker-compose.yml -f docker-compose.main.yml up --build
# This override deliberately has its own database name and volume.
services:
  postgres:
    environment:
      POSTGRES_DB: employer_first_roadmap_main
      POSTGRES_USER: efr_main
      POSTGRES_PASSWORD: efr_main_local_password
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
  efr_bot:
    environment:
      APP_ENV: main
      SEED_DEMO_DATA: "false"
      SEED_MAIN_CATALOG: "true"
      DB_NAME: employer_first_roadmap_main
      DB_USER: efr_main
      DB_PASSWORD: efr_main_local_password

volumes:
  postgres_main_data:
